<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivory - Coming Soon</title>
    <link rel="icon" href="Favicon_Aivory.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Manrope"', 'sans-serif'],
                    },
                    colors: {
                        aivory: {
                            dark: '#0a0a0a',
                            darker: '#050505',
                            card: '#111111',
                            text: '#f5f5f5',
                            muted: '#a3a3a3',
                            accent: '#00e59e'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #030408;
        }

        /* Navigation */
        .navbar {
            background: transparent;
            border-bottom: none;
            box-shadow: none;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .nav-brand {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .nav-brand img {
            height: 34px;
            width: auto;
            object-fit: contain;
        }

        /* Hero */
        .hero {
            text-align: left;
            padding: 0;
            background: #030408;
            color: white;
            border-radius: 0;
            margin-bottom: 0;
            max-width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Hero Background Video */
        #hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            object-fit: cover;
            object-position: center right;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="Aivory logo 2026.svg" alt="Aivory Logo">
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero relative w-full h-screen flex flex-col items-center justify-center"
        style="background: #030408;">
        <video id="hero-video-bg" autoplay muted loop playsinline preload="auto">
            <source src="hero-video/Hero_Video.mp4" type="video/mp4">
        </video>
        <script>
        (function(){var v=document.getElementById('hero-video-bg');if(v){v.play().catch(function(){});v.addEventListener('canplay',function(){v.play().catch(function(){});});}})();
        </script>

        <!-- Grid Overlay with random fade -->
        <canvas id="hero-grid-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.7;"></canvas>
        <script>
        (function(){
            var c=document.getElementById('hero-grid-overlay');
            if(!c)return;
            var ctx=c.getContext('2d');
            var cols=5,rows=8;
            var cells=[];
            function resize(){c.width=c.offsetWidth;c.height=c.offsetHeight;}
            resize();
            window.addEventListener('resize',resize);
            for(var i=0;i<cols*rows;i++){cells.push({opacity:0,target:0,speed:0.02+Math.random()*0.03});}
            var lockedCell=5*cols+2;
            cells[lockedCell].opacity=1;cells[lockedCell].target=1;cells[lockedCell].speed=0;
            function pickTargets(){
                for(var i=0;i<cells.length;i++){
                    if(i===lockedCell)continue;
                    cells[i].target=Math.random()<0.5?0:0.6+Math.random()*0.4;
                }
            }
            setInterval(pickTargets,170);
            function draw(){
                ctx.clearRect(0,0,c.width,c.height);
                var cw=c.width/cols,ch=c.height/rows;
                for(var i=0;i<cells.length;i++){
                    var cell=cells[i];
                    if(cell.opacity<cell.target){cell.opacity=Math.min(cell.opacity+cell.speed,cell.target);}
                    else if(cell.opacity>cell.target){cell.opacity=Math.max(cell.opacity-cell.speed,cell.target);}
                    if(cell.opacity>0.01){
                        var col=i%cols,row=Math.floor(i/cols);
                        ctx.fillStyle='rgba(0,0,0,'+cell.opacity+')';
                        ctx.fillRect(col*cw,row*ch,cw,ch);
                    }
                }
                ctx.strokeStyle='rgba(255,255,255,0.08)';
                ctx.lineWidth=1;
                for(var x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,c.height);ctx.stroke();}
                for(var y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(c.width,y*ch);ctx.stroke();}
                ctx.strokeStyle='rgba(255,255,255,0.25)';
                ctx.lineWidth=1;
                var cs=4;
                for(var x=0;x<=cols;x++){for(var y=0;y<=rows;y++){
                    var px=x*cw,py=y*ch;
                    ctx.beginPath();ctx.moveTo(px-cs,py);ctx.lineTo(px+cs,py);ctx.stroke();
                    ctx.beginPath();ctx.moveTo(px,py-cs);ctx.lineTo(px,py+cs);ctx.stroke();
                }}
                requestAnimationFrame(draw);
            }
            draw();
        })();
        </script>

        <div class="relative z-10 flex flex-col items-center justify-center text-center w-full max-w-4xl"
            style="padding: 6rem 2rem;">
            <h1 class="text-[33.6px] md:text-[50.4px] font-normal mb-2 tracking-tight text-white/90 text-center"
                style="font-family: 'Manrope', sans-serif;">
                Make AI make sense<span class="text-aivory-accent">.</span>
            </h1>

            <!-- Rotating Hero Subheadline -->
            <div id="hero-rotating-container" style="position: relative; height: 5.5rem; overflow: hidden; width: 100%; margin-bottom: 2.5rem;">
                <p id="hero-rotating-text" class="text-[21px] md:text-[33.6px] font-normal text-[#57ffdf] text-center w-full leading-tight"
                    style="font-family: 'Manrope', sans-serif; position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); margin: 0; transition: opacity 0.5s ease-out, transform 0.5s ease-out;">
                    Start with clarity.<br>End with a system that runs.
                </p>
            </div>

            <!-- Coming Soon text (replaces CTA button) -->
            <span style="font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 0.625rem; letter-spacing: 0.12em; text-transform: uppercase; color: white;">
                COMING SOON
            </span>
        </div>
    </div>

    <!-- Rotating Subheadline Animation -->
    <script>
        (function() {
            var messages = [
                'Start with clarity.<br>End with a system that runs.',
                'Know what to build.<br>Before you build anything.',
                'Discover where AI creates value.',
                'Turn AI ambition into execution.',
                'From opportunity to operation.',
                'AI made practical.<br>Built for real business outcomes.'
            ];
            var currentIndex = 0;
            var textEl = document.getElementById('hero-rotating-text');
            var container = document.getElementById('hero-rotating-container');
            if (!textEl || !container) return;

            function rotateMessage() {
                textEl.style.opacity = '0';
                textEl.style.transform = 'translateY(calc(-50% - 14px))';

                setTimeout(function() {
                    currentIndex = (currentIndex + 1) % messages.length;
                    textEl.innerHTML = messages[currentIndex];

                    textEl.style.transition = 'none';
                    textEl.style.transform = 'translateY(calc(-50% + 14px))';
                    textEl.style.opacity = '0';

                    void textEl.offsetHeight;

                    textEl.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                    textEl.style.opacity = '1';
                    textEl.style.transform = 'translateY(-50%)';
                }, 500);
            }

            setInterval(rotateMessage, 4500);
        })();
    </script>
</body>

</html>
